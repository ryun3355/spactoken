name: 스팩 데이터 갱신

on:
  schedule:
    # 평일 17:00 KST (장 마감 후). GitHub cron은 UTC 기준이며 수십 분 늦게 실행될 수 있다.
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 스팩 목록·시세 수집
        run: python3 scripts/update_spac_data.py

      - name: 변경 사항 커밋
        run: |
          if git diff --quiet -- data/spac-stocks.json; then
            echo "변경 사항 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spac-stocks.json
          git commit -m "스팩 데이터 갱신 ($(TZ=Asia/Seoul date +%F))"
          git push
