<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpacToken - 국내 SPAC 관련주 정보</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">SpacToken</h1>
                <p class="subtitle">국내 SPAC 관련주 정보 플랫폼</p>
            </div>
        </header>

        <!-- 검색 & 필터 섹션 -->
        <section class="search-section">
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-box" 
                    placeholder="회사명 또는 종목코드 검색..."
                    onkeyup="filterStocks()"
                >
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
            </div>
            
            <div class="filter-container">
                <button class="filter-btn active" onclick="filterByStatus('all')">전체</button>
                <button class="filter-btn" onclick="filterByStatus('상장')">상장</button>
                <button class="filter-btn" onclick="filterByStatus('예정')">상장예정</button>
                <button class="filter-btn" onclick="filterByStatus('검토중')">검토중</button>
            </div>
        </section>

        <!-- 통계 카드 -->
        <section class="stats-section">
            <div class="stat-card">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">전체 기업</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="listedCount">0</div>
                <div class="stat-label">상장 기업</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pendingCount">0</div>
                <div class="stat-label">예정 기업</div>
            </div>
        </section>

        <!-- 주식 목록 -->
        <section class="stocks-section">
            <div id="stocksContainer" class="stocks-grid">
                <!-- JavaScript로 동적 생성 -->
            </div>
        </section>

        <!-- 로딩 상태 -->
        <div id="noResults" class="no-results" style="display: none;">
            <p>검색 결과가 없습니다.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
