<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpacToken - 국내 상장 스팩 전 종목</title>
    <meta name="description" content="코스피·코스닥에 상장된 스팩(SPAC) 전 종목의 상장일, 종가, 거래량을 한눈에 확인하세요.">
    <!-- script.js·styles.css를 수정하면 ?v= 값도 함께 바꾼다 (브라우저 캐시 갱신용) -->
    <link rel="stylesheet" href="styles.css?v=20261023-2">
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">SpacToken</h1>
                <p class="subtitle">코스피·코스닥 상장 스팩 전 종목</p>
            </div>
        </header>

        <!-- 등락률 상위 종목 차트 -->
        <section id="moversSection" class="movers-section" aria-labelledby="moversTitle" hidden>
            <figure class="movers-card">
                <div class="movers-head">
                    <div>
                        <h2 id="moversTitle" class="movers-title"></h2>
                        <p id="moversCaption" class="movers-caption"></p>
                    </div>
                    <div class="movers-tools">
                        <div id="moversLegend" class="movers-legend" aria-hidden="true">
                            <span><i class="swatch up"></i>상승</span>
                            <span><i class="swatch down"></i>하락</span>
                        </div>
                        <button type="button" id="moversTableToggle" class="table-toggle" aria-pressed="false">표로 보기</button>
                    </div>
                </div>
                <div id="moversChart" class="movers-chart" role="list">
                    <!-- JavaScript로 동적 생성 -->
                </div>
                <table id="moversTable" class="movers-table" hidden>
                    <thead>
                        <tr><th scope="col">종목명</th><th scope="col">전일 대비</th><th scope="col">종가</th><th scope="col">거래량</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <div id="moversTooltip" class="chart-tooltip" role="tooltip" hidden></div>
            </figure>
        </section>

        <!-- 검색 섹션 -->
        <section class="search-section">
            <div class="search-container">
                <input
                    type="search"
                    id="searchInput"
                    class="search-box"
                    placeholder="종목명 또는 종목코드 검색..."
                    autocomplete="off"
                >
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
            </div>

            <div class="controls">
                <div id="marketFilter" class="market-filter" role="group" aria-label="시장 구분">
                    <!-- JavaScript로 동적 생성 -->
                </div>
                <label class="sort-label">
                    정렬
                    <select id="sortSelect" class="sort-select">
                        <option value="listingDate-desc">상장일 최신순</option>
                        <option value="listingDate-asc">상장일 오래된순</option>
                        <option value="volume-desc">거래량 많은순</option>
                        <option value="changeRate-desc">상승률 높은순</option>
                        <option value="changeRate-asc">하락률 높은순</option>
                        <option value="close-desc">종가 높은순</option>
                        <option value="name-asc">종목명순</option>
                    </select>
                </label>
            </div>
        </section>

        <!-- 통계 카드 -->
        <section id="statsSection" class="stats-section">
            <!-- JavaScript로 동적 생성 -->
        </section>

        <p id="resultSummary" class="result-summary"></p>

        <!-- 종목 목록 -->
        <section class="stocks-section">
            <div id="stocksContainer" class="stocks-grid">
                <!-- JavaScript로 동적 생성 -->
            </div>
        </section>

        <div id="statusMessage" class="no-results" hidden></div>

        <footer class="footer">
            <p id="updatedAt"></p>
            <p>종목 목록: <a href="https://kind.krx.co.kr" target="_blank" rel="noopener">KIND 상장법인목록</a> · 시세: 네이버 증권 · 장 마감 후 매일 자동 갱신</p>
            <p>본 사이트의 정보는 투자 참고용이며, 투자 판단의 책임은 투자자 본인에게 있습니다.</p>
        </footer>
    </div>

    <script src="script.js?v=20261023-2"></script>
</body>
</html>
